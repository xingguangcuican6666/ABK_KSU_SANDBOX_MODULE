name: Android smoke apps

on:
  push:
    paths:
      - 'test-apps/**'
      - '.github/workflows/android-smoke-apps.yml'
  pull_request:
    paths:
      - 'test-apps/**'
      - '.github/workflows/android-smoke-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Assemble direct and libsu APKs
        working-directory: test-apps
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode=all \
            :direct:assembleDebug \
            :libsu:assembleDebug

      - name: Verify signed APKs
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          apks=(
            test-apps/direct/build/outputs/apk/debug/direct-debug.apk
            test-apps/libsu/build/outputs/apk/debug/libsu-debug.apk
          )
          for apk in "${apks[@]}"; do
            test -s "$apk"
            "$apksigner" verify --verbose --print-certs "$apk"
            unzip -t "$apk"
          done
          (
            cd test-apps
            sha256sum \
              direct/build/outputs/apk/debug/direct-debug.apk \
              libsu/build/outputs/apk/debug/libsu-debug.apk \
              | tee apk-sha256.txt
            sha256sum -c apk-sha256.txt
          )

      - name: Upload verified APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abk-sandbox-smoke-apks-${{ github.sha }}
          path: |
            test-apps/direct/build/outputs/apk/debug/direct-debug.apk
            test-apps/libsu/build/outputs/apk/debug/libsu-debug.apk
            test-apps/apk-sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
